# 🏥 의국 저널 클럽 타겟 저널 리스트 (PM&R Ultimate Edition)
# (💡 사용하지 않을 저널은 맨 앞에 '#'을 붙여서 주석 처리하시면 됩니다)

target_journals:
  # -------------------------------------------------------------------
  # 🥇 1. 종합 재활 (General PM&R) - 재활의학의 뼈대
  # -------------------------------------------------------------------
  - "Archives of physical medicine and rehabilitation" # [Q1 / IF ~4.0] 미국재활의학회(ACRM) 공식. 재활 분야 인용수 1위의 절대 권위지
  - "Annals of rehabilitation medicine"                # [국내 최고 권위] 대한재활의학회(KARM) 공식 학술지
  - "American journal of physical medicine & rehabilitation" # [Q1 / IF ~3.0] 미국 재활의학 대학협의회(AAP) 공식 학술지
  - "PM R"                                             # [Q2 / IF ~2.5] 미국 재활의학과 전문의 학회(AAPM&R) 공식. 임상 활용도 최상
  - "Journal of rehabilitation medicine"               # [Q1 / IF ~3.0] 국제(ISPRM) 및 유럽재활의학회 공식 학술지
  - "European journal of physical and rehabilitation medicine" # [Q1 / IF ~3.5] 유럽 탑티어 재활 저널
  - "Clinical rehabilitation"                          # [Q1 / IF ~3.0] 영국 기반. 실제 치료적 중재(Intervention) 효과 검증에 특화
  - "Disability and rehabilitation"                    # [Q2 / IF ~2.5] 포괄적 재활, 장애 평가 및 정책 분야 권위지

  # -------------------------------------------------------------------
  # 🧠 2. 뇌신경 재활 & 뇌졸중 (Neurorehab & Stroke)
  # -------------------------------------------------------------------
  - "Neurorehabilitation and neural repair"            # [Q1 / IF ~4.0] 뇌신경재활 세부 분야 압도적 1위 저널
  - "Stroke"                                           # [Q1 / IF ~8.0+] 미국심장협회(AHA) 발행. 뇌졸중 분야 세계 1위 (우리 필터로 재활의학과 논문만 추출!)
  - "The Journal of head trauma rehabilitation"        # [Q1 / IF ~3.0] 외상성 뇌손상(TBI) 재활 분야 세계 1위

  # -------------------------------------------------------------------
  # ⚡️ 3. 근전도 및 전기진단 (EMG & Neuromuscular)
  # -------------------------------------------------------------------
  - "Muscle & nerve"                                   # [Q2 / IF ~2.5] ★ AANEM(미국근전도학회) 공식 학술지. 신경근육/EMG 분야 바이블
  - "Clinical neurophysiology"                         # [Q1 / IF ~4.0] 국제임상신경생리학회(IFCN) 공식. 뇌파, 유발전위, 뇌자극(TMS/tDCS) 등 최고 권위

  # -------------------------------------------------------------------
  # 🦴 4. 척수손상 및 척추 (SCI & Spine)
  # -------------------------------------------------------------------
  - "Spinal cord"                                      # [Q2 / IF ~2.0] 국제척수학회(ISCoS) 공식. 척수손상 재활 1위 저널
  - "Spine"                                            # [Q1 / IF ~3.0] 척추 질환 세계 1위 저널. (정형/신경외과 밭이지만 재활의학과 보존적 치료/시술 논문 픽업용)

  # -------------------------------------------------------------------
  # 💉 5. 통증, 근골격계 및 스포츠 (Pain, MSK & Sports)
  # -------------------------------------------------------------------
  - "Pain"                                             # [Q1 / IF ~7.0] 세계통증학회(IASP) 공식 학술지. 통증 분야 압도적 세계 1위
  - "Pain medicine"                                    # [Q2 / IF ~3.0] 미국통증의학회(AAPM) 공식. 인터벤션(시술) 및 임상 통증 권위지
  - "British journal of sports medicine"               # [Q1 / IF ~11.0+] 스포츠의학 부동의 세계 1위. IF가 매우 높아 발표 시 임팩트가 큼

  # -------------------------------------------------------------------
  # 👶 6. 소아 재활 (Pediatric Rehabilitation)
  # -------------------------------------------------------------------
  - "Developmental medicine and child neurology"       # [Q1 / IF ~4.0] 뇌성마비(CP) 및 소아재활 분야 압도적 1위 (AACPDM 공식)

# =====================================================================
# ⚙️ [선택 사항] 타 진료과 / 연구실 맞춤형 확장 설정 (기본값: 재활의학과 전문의 & EBM 시니어 교수)
# 다른 진료과(정형외과, 신경과, 내과 등)에서 사용할 경우 아래 주석을 해제하고 수정하세요.
