# 🏥 Medical Journal Club Target Journals (PM&R Ultimate Edition)
# 💡 Tip: Prefix any journal line with '#' to disable scanning that journal.

target_journals:
  # -------------------------------------------------------------------
  # 🥇 1. General Physical Medicine & Rehabilitation (Core PM&R)
  # -------------------------------------------------------------------
  - "Archives of physical medicine and rehabilitation" # [Q1 / IF ~4.0] Official journal of ACRM
  - "Annals of rehabilitation medicine"                # Official journal of KARM
  - "American journal of physical medicine & rehabilitation" # [Q1 / IF ~3.0] Official journal of AAP
  - "PM R"                                             # [Q2 / IF ~2.5] Official journal of AAPM&R
  - "Journal of rehabilitation medicine"               # [Q1 / IF ~3.0] Official journal of ISPRM & ESPRM
  - "European journal of physical and rehabilitation medicine" # [Q1 / IF ~3.5] Top-tier European PM&R journal
  - "Clinical rehabilitation"                          # [Q1 / IF ~3.0] Specialized in clinical rehabilitation interventions
  - "Disability and rehabilitation"                    # [Q2 / IF ~2.5] Comprehensive rehabilitation & policy

  # -------------------------------------------------------------------
  # 🧠 2. Neurorehabilitation & Stroke
  # -------------------------------------------------------------------
  - "Neurorehabilitation and neural repair"            # [Q1 / IF ~4.0] #1 in Neurorehabilitation
  - "Stroke"                                           # [Q1 / IF ~8.0+] AHA official journal (Filtered for PM&R MD-led RCTs)
  - "The Journal of head trauma rehabilitation"        # [Q1 / IF ~3.0] #1 in Traumatic Brain Injury (TBI) rehabilitation

  # -------------------------------------------------------------------
  # ⚡️ 3. Electrodiagnosis & Neuromuscular (EMG)
  # -------------------------------------------------------------------
  - "Muscle & nerve"                                   # [Q2 / IF ~2.5] Official journal of AANEM
  - "Clinical neurophysiology"                         # [Q1 / IF ~4.0] Official journal of IFCN (EMG, EP, TMS/tDCS)

  # -------------------------------------------------------------------
  # 🦴 4. Spinal Cord Injury & Spine (SCI & Spine)
  # -------------------------------------------------------------------
  - "Spinal cord"                                      # [Q2 / IF ~2.0] Official journal of ISCoS
  - "Spine"                                            # [Q1 / IF ~3.0] Premier spine journal (Filtered for PM&R conservative/interventional RCTs)

  # -------------------------------------------------------------------
  # 💉 5. Pain, Musculoskeletal & Sports Medicine (Pain, MSK & Sports)
  # -------------------------------------------------------------------
  - "Pain"                                             # [Q1 / IF ~7.0] Official journal of IASP
  - "Pain medicine"                                    # [Q2 / IF ~3.0] Official journal of AAPM
  - "British journal of sports medicine"               # [Q1 / IF ~11.0+] #1 in Sports Medicine

  # -------------------------------------------------------------------
  # 👶 6. Pediatric Rehabilitation
  # -------------------------------------------------------------------
  - "Developmental medicine and child neurology"       # [Q1 / IF ~4.0] Official journal of AACPDM

