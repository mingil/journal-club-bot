services:
  journal-club-bot:
    build: .
    container_name: journal-club-bot
    restart: on-failure:5
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - PYTHONUNBUFFERED=1      # Flush Python logs immediately to Docker stdout
    volumes:
      - ./config:/app/config    # Mount target journal config & local Zotero cache
      - ./logs:/app/logs        # Persist rotating system logs on the host
      - ./src:/app/src          # Live-mount source code for instant updates without rebuilding
